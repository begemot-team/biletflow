name: Deploy to Heroku

# Every push to main (a merged release PR from dev) updates https://begemot-b8b43e7ea8ea.herokuapp.com.
# Heroku builds Dockerfile.heroku from heroku.yml and runs migrations in the release
# phase; if the build or release fails, the previous version keeps running.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heroku-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: heroku
      url: https://begemot-b8b43e7ea8ea.herokuapp.com
    env:
      HEROKU_APP: begemot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git push --force \
            "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP}.git" \
            HEAD:refs/heads/main

      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://begemot-b8b43e7ea8ea.herokuapp.com/api/health"; then exit 0; fi
            sleep 10
          done
          exit 1
